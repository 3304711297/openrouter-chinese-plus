name: CI

# push / PR 时验证:构建可复现、语法正确、已提交产物与源一致、模块单元测试通过。
# 与 upstream-sync(定时)互补:上游同步只管词库更新,这里管人改的代码不把仓库改坏。

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: 构建产物并校验语法
        run: |
          node build.mjs
          node --check openrouter-chinese-plus.user.js

      # 防止手改 sources/ 或模块后忘记重新构建就提交,
      # 导致线上产物与仓库源不一致
      - name: 校验已提交产物与源一致
        run: git diff --exit-code -- openrouter-chinese-plus.user.js

      - name: 单元测试
        run: node --test tests/cny-price.test.cjs tests/check-upstream.test.mjs

  # E2E 冒烟(定位:冒烟,不承担完整功能测试):真实访问 openrouter.ai 以 document-start
  # 语义注入产物,断言关键中文节点与 ≈¥ 参考价出现(不断言具体金额/固定文案);
  # 汇率服务不可用时引擎自带默认汇率兜底,截图上传为 CI artifact
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E 冒烟测试
        run: npx playwright test tests/e2e.spec.mjs

      - name: 上传截图 artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: test-results/*.png
          if-no-files-found: warn

name: 上游词库同步与重建

# 定时检测上游(datou1996/openrouter-chinese)词库更新:
#   有更新 → 覆盖 sources/ 快照 → 递增版本号重新构建 → 自动提交推送
#   无更新 → 直接结束
#   上游不可用(删除、断网、改名)→ 仅提交状态记录(upstream.state.json),跳过重建,工作流保持绿色
# 重建只由 check-upstream.mjs 的退出码 10(快照内容有实质更新)触发;
# 退出码 20(状态文件缺失/损坏、脚本自身异常)会使"检查上游更新"步骤失败、工作流变红报警;
# git diff 只用于判断"是否有文件需要提交",不作为是否重建的依据——
# 否则首次进入 unavailable 时 state.json 的状态变化也会触发一次无意义的重建提交。
# 上游快照完整保存在本仓库 sources/ 目录,上游消失不影响本项目继续构建与发布。

on:
  schedule:
    - cron: "0 */6 * * *" # 每 6 小时检查一次
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: 检查上游更新
        id: check
        run: |
          code=0
          node scripts/check-upstream.mjs || code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0=无更新 10=快照已更新;其他码(如 20=状态文件损坏/脚本自身异常)
          # 属仓库自身问题,绝不能静默放过——否则检查器坏了 CI 依然全绿,词库停更无人察觉
          if [ "$code" != "0" ] && [ "$code" != "10" ]; then
            echo "::error::check-upstream.mjs 异常退出(退出码 ${code}),需人工介入"
            exit 1
          fi

      - name: 判断是否有文件变更
        id: diff
        run: |
          if git diff --quiet -- sources/ upstream.state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 重新构建并校验
        if: steps.check.outputs.exitcode == '10'
        run: |
          node build.mjs
          node --check openrouter-chinese-plus.user.js

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          DICT_VER="$(node -p "JSON.parse(require('fs').readFileSync('upstream.state.json','utf8')).sources.datou1996.versions.dict")"
          BUILD_NO="$(node -p "JSON.parse(require('fs').readFileSync('upstream.state.json','utf8')).buildNumber")"
          if [ "${{ steps.check.outputs.exitcode }}" = "10" ]; then
            MSG="chore: 同步上游词库 v${DICT_VER} 并重新构建 (build ${BUILD_NO})"
          else
            MSG="chore: 记录上游状态变化(快照未变,跳过重建)"
          fi
          git commit -m "$MSG"
          git push
